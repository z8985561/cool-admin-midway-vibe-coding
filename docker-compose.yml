version: "3.1"

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: cool-mysql
    restart: unless-stopped
    command:
      --default-authentication-plugin=mysql_native_password
      --sql_mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      --group_concat_max_len=102400
    ports:
      - "3306:3306"
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "cool"
    networks:
      - cool
  # Redis 缓存
  redis:
    image: redis:alpine
    container_name: cool-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data/redis:/data
    networks:
      - cool

  # 应用服务
  app:
    build: .
    container_name: cool-app
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: 123456
      MYSQL_DATABASE: cool
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./data/upload:/app/data/upload
      - ./start.sh:/tmp/start.sh:ro
    command: ["/bin/sh", "/tmp/start.sh"]
    depends_on:
      - mysql
      - redis
    networks:
      - cool

networks:
  cool:
    driver: bridge
